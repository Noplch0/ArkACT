name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag matching common/stronghold_version.h (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # English Windows runners otherwise use cp1252 for Python's stdout.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate version and tag
        run: |
          $version = [regex]::Match((Get-Content common/stronghold_version.h -Raw), 'kPluginVersion\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -cne "v$version") { throw 'Release tag and source version differ.' }
          $tagged = git rev-parse "$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagged -ne (git rev-parse HEAD)) { throw 'Tag must point to the build commit.' }
      - name: Prepare pinned Zig and matching ArkImGui
        run: ./tools/prepare-dependencies.ps1
      - name: Run nine test suites and seven production compile checks
        run: |
          Start-Transcript -Path .build/verify-ci.log
          try {
            $deps = Get-Content .build/dependencies.json -Raw | ConvertFrom-Json
            ./verify.ps1 -ImGuiDir $deps.ImGuiDir
            if ($LASTEXITCODE -ne 0) { throw 'Offline verification failed.' }
          } finally { Stop-Transcript }
      - name: Build GNU ABI plugin
        run: |
          Start-Transcript -Path .build/build-ci.log
          try {
            $deps = Get-Content .build/dependencies.json -Raw | ConvertFrom-Json
            ./build-plugin.ps1 -Zig $deps.Zig -ImGuiDir $deps.ImGuiDir -ArkImGuiImportLibrary $deps.ArkImGuiImportLibrary
          } finally { Stop-Transcript }
      - name: Independently inspect plugin and workbook
        run: |
          python tools/inspect_binary.py
          if ($LASTEXITCODE -ne 0) { throw 'Plugin validation failed.' }
          python -B -m unittest discover -s tests -p 'test_inspect_workbook.py'
          if ($LASTEXITCODE -ne 0) { throw 'Workbook inspector regression tests failed.' }
          python tools/inspect_workbook.py
          if ($LASTEXITCODE -ne 0) { throw 'Workbook validation failed.' }
      - name: Package plugin and licenses
        run: ./tools/package-release.ps1 -Tag $env:RELEASE_TAG
      - name: Publish verified release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $existing = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          $release = @($existing | Where-Object tag_name -CEQ $env:RELEASE_TAG)
          if ($release.Count -ne 0) { throw 'Refusing to overwrite an existing release; inspect it before retrying.' }
          $zip = ".build/release/ArkACT-$env:RELEASE_TAG-windows-x64.zip"
          gh release create $env:RELEASE_TAG $zip "$zip.sha256" --latest --verify-tag --title "ArkACT $env:RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect the remote release before retrying.' }
          $published = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,url,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.isDraft -or $published.isPrerelease -or $published.tagName -cne $env:RELEASE_TAG -or $published.assets.Count -ne 2) { throw 'Release is not the expected two-asset public release.' }
          $names = @($published.assets.name | Sort-Object)
          $expected = @([IO.Path]::GetFileName($zip), ([IO.Path]::GetFileName($zip) + '.sha256') | Sort-Object)
          if (Compare-Object $expected $names) { throw 'Unexpected release assets.' }
          $latest = gh api "repos/$env:GH_REPO/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.tag_name -cne $env:RELEASE_TAG -or $latest.draft -or $latest.prerelease) { throw 'Latest does not point to the published release.' }
          "Latest release verified: $($published.url)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Preserve validation logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics
          path: |
            .build/dependencies.json
            .build/*-ci.log
          if-no-files-found: ignore
